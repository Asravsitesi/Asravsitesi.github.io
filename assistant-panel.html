<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#087f84"><title>Asrav AI Asistanı</title><link rel="manifest" href="assistant.webmanifest?v=2700"><link rel="icon" href="icon.svg"><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#e8f3f2;font-family:Inter,system-ui}.shell{height:100%;display:grid;grid-template-rows:54px 1fr}.top{background:linear-gradient(135deg,#087f84,#075961);color:#fff;display:flex;align-items:center;padding:0 14px;gap:10px;box-shadow:0 5px 20px #1238;z-index:2}.logo{width:34px;height:34px;border-radius:10px;background:#ffffff25;display:grid;place-items:center;font-weight:900}.top b{font-size:14px}.top small{display:block;color:#bfe2df}.top button{margin-left:auto;border:1px solid #ffffff50;background:#ffffff18;color:#fff;border-radius:9px;padding:7px 11px}iframe{width:100%;height:100%;border:0;background:#eef7f6}@media(display-mode:standalone){#install{display:none}}</style></head><body><div class="shell"><header class="top"><span class="logo">A</span><span><b>Asrav AI</b><small>Bağımsız asistan paneli</small></span><button id="install">Uygulamayı yükle</button></header><iframe src="/?assistant=1&panel=1" allow="microphone; clipboard-read; clipboard-write"></iframe></div><script>let p;addEventListener('beforeinstallprompt',e=>{e.preventDefault();p=e});install.onclick=async()=>{if(p){await p.prompt();p=null}else alert('Tarayıcı menüsünden Uygulamayı yükle seçeneğini kullanın.')};navigator.serviceWorker?.register('/studio-sw.js')</script></body></html>
